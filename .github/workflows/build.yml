name: Build Nark-Browser (arm64)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      # 改行コードの自動変換（CRLF -> LF）
      - name: Convert line endings to LF
        run: |
          sudo apt-get update && sudo apt-get install -y dos2unix
          dos2unix build.sh src/main.py
          chmod +x build.sh

      # --platform linux/arm64 を追加
      - name: Build inside Ubuntu arm64 Container
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v ${{ github.workspace }}:/work \
            -w /work \
            arm64v8/ubuntu:24.04 \
            /bin/bash ./build.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nark-Browser-arm64
          path: dist/Nark-Browser
