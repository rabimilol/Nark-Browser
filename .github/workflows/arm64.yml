name: Build Nark-Browser (arm64)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Convert line endings to LF
        run: |
          sudo apt-get update && sudo apt-get install -y dos2unix devscripts dh-python dput gnupg
          dos2unix build.sh src/main.py
          chmod +x build.sh

      - name: Build Arm64 .deb
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v ${{ github.workspace }}:/work \
            -w /work \
            arm64v8/ubuntu:22.04 \
            /bin/bash ./build.sh

      - name: Upload .deb Package
        uses: actions/upload-artifact@v4
        with:
          name: nark-browser-deb-arm64
          path: dist_deb/nark-browser_arm64.deb
